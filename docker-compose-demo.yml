version: '3.8'

services:
  demo:
    build:
      context: .
      dockerfile: Dockerfile.demo
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Smart Login Guardian
      - APP_VERSION=2.0.0
      - ENVIRONMENT=demo
    volumes:
      - ./demo_enterprise.py:/app/demo_enterprise.py:ro
    command: python3 demo_enterprise.py
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
