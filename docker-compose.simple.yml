version: '3.8'

# Simple production stack with PostgreSQL + Redis
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: smartguardian
      POSTGRES_USER: guardian
      POSTGRES_PASSWORD: guardian123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardian"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://guardian:guardian123@postgres:5432/smartguardian
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=change-this-in-production
      - JWT_SECRET_KEY=change-this-too
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "
      alembic upgrade head &&
      uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --workers 4
      "

volumes:
  postgres_data:
